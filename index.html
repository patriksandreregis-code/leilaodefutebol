<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leilão de Futebol</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a47;--card:#143a5e;--line:#2a5782;--tx:#f2f6fa;--mu:#9bb6d1;--ac:#ffb703;--ok:#4ad295;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,.big{font-family:'Barlow Condensed','Arial Narrow',sans-serif;margin:0;letter-spacing:.01em}
button,input{font:inherit;border-radius:6px;border:1px solid var(--line)}
input{background:#0b2036;color:var(--tx);padding:.6rem .8rem;width:100%}
button{background:var(--card);color:var(--tx);padding:.6rem 1rem;cursor:pointer;font-weight:600}
button.pri{background:var(--ac);color:#241a00;border-color:var(--ac)}
button:disabled{opacity:.35;cursor:not-allowed}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:1rem}
#join{max-width:380px;margin:12vh auto;display:grid;gap:.7rem}
#join h1{font-size:3rem;line-height:1}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:3fr 2fr;gap:1rem}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem}
.pos{background:var(--ac);color:#241a00;font-weight:700;padding:.1rem .6rem;border-radius:99px;font-size:.85rem}
.lot h1{font-size:3.4rem;line-height:1;margin:.6rem 0 .2rem}
.big{font-size:2.6rem;font-weight:800;color:var(--ac)}
.track{height:10px;background:#0b2036;border-radius:99px;overflow:hidden;margin:.8rem 0 .3rem}
#bar{height:100%;background:var(--ok);width:100%}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.mu{color:var(--mu)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.pl{border-top:1px solid var(--line);padding:.6rem 0}.pl:first-child{border:0;padding-top:0}
.pl.me{background:#1a4a77;margin:0 -.5rem;padding:.6rem .5rem;border-radius:6px}
.chip{display:inline-block;background:#0b2036;border-radius:4px;padding:0 .4rem;margin:.15rem .2rem 0 0;font-size:.85rem}
.log{margin-top:1rem;font-size:.9rem;color:var(--mu)}.log div:last-child{color:var(--tx)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.5rem;border-top:1px solid var(--line);vertical-align:top}
</style>
</head>
<body>
<div id="join" class="panel">
  <h1>Leilão de Futebol</h1>
  <p class="mu">Dê lances nos craques e monte o melhor time sem estourar o orçamento.</p>
  <input id="name" placeholder="Seu nome" maxlength="16">
  <input id="room" placeholder="Código da sala" maxlength="8">
  <button class="pri" onclick="join(false)">Entrar na sala</button>
  <button onclick="join(true)">Criar nova sala</button>
</div>

<div id="game" class="wrap" hidden>
  <div class="top">
    <div><span class="mu">Sala</span> <b id="code" style="font-size:1.4rem"></b></div>
    <button id="vz" onclick="voice=!voice;if(!voice)speechSynthesis.cancel();this.textContent=voice?'Narrador: ligado':'Narrador: desligado'">Narrador: ligado</button>
  </div>
  <div class="grid">
    <div><div class="panel" id="main"></div><div class="log" id="log"></div></div>
    <div class="panel" id="players"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const PN = { GK: 'Goleiro', DEF: 'Defensor', MID: 'Meia', ATT: 'Atacante' };
let ws, S = null, name = '', room = '', voice = true;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const send = m => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
const bid = a => send({ t: 'bid', amount: a });
const nm = id => (S.players.find(p => p.id === id) || {}).name || '';
const score = p => p.squad.reduce((s, x) => s + x.r, 0);

$('room').value = (new URLSearchParams(location.search).get('sala') || '').toUpperCase();

function join(create) {
  name = $('name').value.trim();
  room = (create ? Math.random().toString(36).slice(2, 6) : $('room').value).trim().toUpperCase();
  if (!name || !room) return alert('Informe seu nome e o código da sala.');
  connect();
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = () => send({ t: 'join', room, name });
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'state') { S = m; S.at = Date.now(); render(); }
    else if (m.t === 'say') speak(m.text);
    else if (m.t === 'err') alert(m.text);
  };
  ws.onclose = () => { if (S) setTimeout(connect, 2000); }; // reconecta sozinho
}
function speak(t) {
  if (!voice || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = 'pt-BR'; u.rate = 1.1;
  speechSynthesis.speak(u);
}

function render() {
  $('join').hidden = true; $('game').hidden = false;
  const me = S.players.find(p => p.id === S.you), isHost = S.you === S.host;
  $('code').textContent = S.code;
  let h = '';
  if (S.phase === 'lobby') {
    h = `<h2 style="font-size:2.2rem">Sala de espera</h2>
      <p>Link para convidar: <b>${esc(location.origin + '/?sala=' + S.code)}</b></p>
      <p class="mu">Cada jogador tem € 200M e monta um time com ${S.slots.GK} goleiro, ${S.slots.DEF} defensores, ${S.slots.MID} meias e ${S.slots.ATT} atacantes. Vence quem somar a maior nota.</p>
      ${isHost ? `<button class="pri" onclick="send({t:'start'})">Iniciar leilão</button>` : '<p>Aguardando o anfitrião iniciar…</p>'}`;
  } else if (S.phase === 'end') {
    const rk = [...S.players].sort((a, b) => score(b) - score(a) || b.budget - a.budget);
    h = `<h2 style="font-size:2.2rem">Resultado final</h2><table>` + rk.map((p, i) =>
      `<tr><td><b>${i + 1}º ${esc(p.name)}</b><br><span class="mu">Nota ${score(p)} · sobrou € ${p.budget}M</span></td>
       <td>${p.squad.map(x => `<span class="chip">${esc(x.n)} ${x.r}</span>`).join('')}</td></tr>`).join('') + `</table>` +
      (isHost ? `<p><button class="pri" onclick="send({t:'again'})">Jogar de novo</button></p>` : '');
  } else if (!S.lot) {
    h = `<h2 style="font-size:2.2rem">Preparando o próximo jogador…</h2>`;
  } else {
    const l = S.lot, min = l.bidder ? l.bid + 1 : l.base, can = me.need[l.pos] > 0 && l.bidder !== me.id;
    h = `<div class="lot"><span class="pos">${PN[l.pos]}</span><h1>${esc(l.n)}</h1>
      <div class="mu">Nota ${l.r}</div><div class="big">€ ${l.bidder ? l.bid : l.base}M</div>
      <div>${l.bidder ? `Maior lance: <b>${esc(nm(l.bidder))}</b>` : 'Ninguém deu lance ainda'}</div>
      <div class="track"><div id="bar"></div></div><div id="tm" class="mu"></div>
      <div class="btns">${[0, 1, 4, 9].map(d => min + d).map(a =>
        `<button class="pri" ${can && a <= me.max ? '' : 'disabled'} onclick="bid(${a})">€ ${a}M</button>`).join('')}</div>
      ${me.need[l.pos] < 1 ? '<p class="bad">Você já completou essa posição.</p>' : l.bidder === me.id ? '<p class="ok">Seu lance está na frente.</p>' : ''}</div>`;
  }
  $('main').innerHTML = h;
  $('players').innerHTML = S.players.map(p => `<div class="pl ${p.id === S.you ? 'me' : ''}">
    <b>${esc(p.name)}</b>${p.id === S.host ? ' 👑' : ''}${p.on ? '' : ' <span class="bad">(offline)</span>'}
    <span class="mu" style="float:right">€ ${p.budget}M · ${p.squad.length}/${S.total}</span><br>
    ${p.squad.map(x => `<span class="chip">${esc(x.n)} · ${x.price}M</span>`).join('') || '<span class="mu">Sem jogadores</span>'}</div>`).join('');
  $('log').innerHTML = S.log.map(t => `<div>${esc(t)}</div>`).join('');
}

setInterval(() => {
  if (S && S.lot && $('bar')) {
    const left = Math.max(0, S.lot.left - (Date.now() - S.at));
    $('bar').style.width = Math.min(100, left / 120) + '%';
    $('bar').style.background = left < 3000 ? 'var(--bad)' : 'var(--ok)';
    $('tm').textContent = (left / 1000).toFixed(1) + 's';
  }
}, 100);
</script>
</body>
</html>
